android {
    signingConfigs {
        release {
            def properties
            def propertiesFile = rootProject.file('signing.properties')
            if (propertiesFile.exists()) {
                properties = new Properties()
                properties.load(propertiesFile.newDataInputStream())
            }
            def getString = { String propertyName, String environmentName ->
                return properties?.get(propertyName) ?: System.getenv(environmentName)
            }

            def storeFilePath = getString('storeFile', 'STORE_FILE')
            if (storeFilePath) {
                def file = rootProject.file(storeFilePath)
                if (file.exists()) {
                    storeFile file
                    storePassword getString('storePassword', 'STORE_PASSWORD')
                    keyAlias getString('keyAlias', 'KEY_ALIAS')
                    keyPassword getString('keyPassword', 'KEY_PASSWORD')
                }
            }
        }
    }
}
